[project]
name = "equivariant-linear-attention"
version = "0.1.0"
description = "Canonical parity-aware equivariant linear attention with exact global transport and sparse local geometry"
authors = [
    { name = "eightmm" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.1",
]

[project.optional-dependencies]
qm9 = [
    "rdkit>=2026.3.3",
    "torch-geometric>=2.8.0",
]
pdbbind = [
    "datasets>=4.4.1",
]
# scripts/check.sh gpu activates this extra and asserts triton_available().
triton = [
    "triton>=3.0.0; sys_platform == 'linux'",
]

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]

[tool.coverage.report]
precision = 2
