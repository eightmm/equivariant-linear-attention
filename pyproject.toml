[project]
name = "equivariant-attention"
version = "0.1.0"
description = "O(3)-equivariant local/global attention with factorized geometric moments"
authors = [
    { name = "eightmm" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.12.1",
]

[project.optional-dependencies]
qm9 = [
    "rdkit>=2026.3.3",
    "torch-geometric>=2.8.0",
]

[project.scripts]
equivariant-attention = "equivariant_attention:main"

[build-system]
requires = ["uv_build>=0.10.3,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "numpy>=2.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
]
