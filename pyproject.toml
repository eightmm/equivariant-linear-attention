[project]
name = "equivariant-linear-attention"
version = "0.3.0"
description = "Pair-centric O(3)-equivariant triangle and linear attention for 3D data"
authors = [{ name = "eightmm" }]
requires-python = ">=3.12"
dependencies = ["torch>=2.10"]

[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "ruff>=0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
precision = 2
