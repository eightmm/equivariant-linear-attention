name: cpu-ci

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - name: Verify canonical import surface
        run: |
          uv run python - <<'PY'
          import equivariant_linear_attention as ela
          from equivariant_linear_attention import ELA, ELAGraph

          assert ELA is not None
          assert ELAGraph is not None
          assert set(ela.__all__) == {"ELA", "ELAGraph"}
          PY
      - run: scripts/check.sh fast
