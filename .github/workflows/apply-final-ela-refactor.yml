name: Apply final ELA refactor

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/ela-input-refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ela-input-refactor
          fetch-depth: 0

      - name: Apply validated refactor as one clean commit
        shell: bash
        run: |
          set -euo pipefail

          cat .agent/final.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decode > /tmp/final.patch
          printf '%s  %s\n' \
            '65c83d7708ad52f62dbc0e5b3ac7a9dc8a86bf9e8cbb28f1bb93a1a7e8e97b75' \
            '/tmp/final.patch.gz' > /tmp/final.patch.gz.sha256
          gzip --stdout /tmp/final.patch > /tmp/final.patch.gz
          sha256sum --check /tmp/final.patch.gz.sha256

          git fetch origin main
          git reset --hard origin/main
          git apply \
            --index \
            --whitespace=nowarn \
            --exclude=.github/workflows/agent-source-export.yml \
            /tmp/final.patch

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: unify ELA graph API"
          git push --force origin HEAD:agent/ela-input-refactor
