name: Apply final ELA refactor

on:
  push:
    branches: [agent/ela-input-refactor]
    paths:
      - .agent/final-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ela-input-refactor
          fetch-depth: 0

      - name: Apply validated refactor
        shell: bash
        run: |
          set -euo pipefail
          cat .agent/final.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decode > /tmp/final.patch
          git apply --index --whitespace=nowarn /tmp/final.patch
          rm -f \
            .agent/final-ready \
            .agent/final.patch.gz.b64.part* \
            .agent/ela-refactor.patch \
            .github/workflows/apply-final-ela-refactor.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: unify ELA graph API"
          git push origin HEAD:agent/ela-input-refactor
