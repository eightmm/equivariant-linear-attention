name: Apply final ELA refactor

on:
  push:
    branches: [agent/ela-input-refactor]
    paths:
      - .agent/final-ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/ela-input-refactor
          fetch-depth: 0

      - name: Apply validated refactor as one clean commit
        shell: bash
        run: |
          set -euo pipefail

          cat .agent/final.patch.gz.b64.part* \
            | base64 --decode \
            | gzip --decode > /tmp/final.patch

          git fetch origin main
          git reset --hard origin/main
          git apply \
            --index \
            --whitespace=nowarn \
            --exclude=.github/workflows/agent-source-export.yml \
            /tmp/final.patch

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "refactor: unify ELA graph API"
          git push --force origin HEAD:agent/ela-input-refactor
